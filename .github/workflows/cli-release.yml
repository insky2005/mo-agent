name: cli-release

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 cli-v0.2.0），版本必须与 package.json 一致"
        required: true
      dry_run:
        description: "只构建、不发布（第一次验证矩阵时用）"
        type: boolean
        default: true

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    name: 版本与测试
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 版本一致性（tag == package.json == cli/lib/version.mjs）
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-version.mjs
          VERSION="$(node -p "require('./package.json').version")"
          RAW="${{ inputs.tag || github.ref_name }}"
          # 统一用 cli-v* 前缀，其余组件各用各的（apk-v* / desktop-v*）
          TAG="$RAW"
          case "$RAW" in
            cli-v*) ;;
            v*) TAG="cli-$RAW" ;;   # 兼容裸 tag
            *) echo "::error::tag 必须以 cli-v 开头：$RAW"; exit 1 ;;
          esac
          if [ "$TAG" != "cli-v$VERSION" ]; then
            echo "::error::tag $TAG 与 package.json $VERSION 不一致（应为 cli-v$VERSION）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 静态检查
        run: npm run check

      - name: 测试
        run: npm test

  build:
    name: build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个平台都在原生 runner 上构建：产物能直接执行，也不依赖交叉编译下载 target 运行时
          - { os: ubuntu-latest,    platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-14,         platform: darwin-arm64 }
          - { os: macos-13,         platform: darwin-x64 }
          - { os: windows-latest,   platform: windows-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          OUT_NAME="mo-$PLATFORM" bash scripts/build-cli.sh

      - name: 冒烟（产物必须能自报版本）
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(ls cli/dist/mo-${{ matrix.platform }}* | head -1)"
          echo "产物：$BIN"
          "$BIN" --version

      - name: 产物密钥扫描（SEC-001）
        shell: bash
        run: node scripts/check-artifacts.mjs --enforce cli/dist

      - uses: actions/upload-artifact@v4
        with:
          name: mo-${{ matrix.platform }}
          path: cli/dist/mo-${{ matrix.platform }}*
          if-no-files-found: error

  release:
    name: 发布
    needs: [verify, build]
    # 手动触发默认 dry_run=true：只验证构建，不建 tag、不发 release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256
        run: node scripts/checksums.mjs dist

      - name: 发布前再扫一遍
        run: node scripts/check-artifacts.mjs --enforce dist

      - name: 列出产物
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          # 手动触发时 tag 可能还不存在，用当前提交而不是默认分支
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/mo-darwin-arm64
            dist/mo-darwin-arm64.sha256
            dist/mo-darwin-x64
            dist/mo-darwin-x64.sha256
            dist/mo-linux-x64
            dist/mo-linux-x64.sha256
            dist/mo-linux-arm64
            dist/mo-linux-arm64.sha256
            dist/mo-windows-x64.exe
            dist/mo-windows-x64.exe.sha256
            dist/SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/mo-*"
