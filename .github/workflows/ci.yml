name: ci

on:
  push:
    # main 与功能分支都跑；PR 上也会跑一次
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 静态检查
        run: npm run check

      - name: 测试
        run: npm test

  windows:
    # 已知 POSIX 假设（session-launch / agent-hooks / chmod），先记录基线不阻断，
    # 等 Windows 适配收口后再改成必过。见 docs/plans/cli-cross-platform-verify.md §3.2。
    name: windows baseline（不阻断）
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: 测试
        run: npm test 2>&1 | tee windows-test.log
        shell: bash
        continue-on-error: true

      - name: 静态检查
        run: npm run check 2>&1 | tee windows-check.log
        shell: bash
        continue-on-error: true

      - name: 结果汇总（不阻断，但要让结论可见）
        if: always()
        shell: bash
        run: |
          # 这一步只负责报告，别让它自己把 job 弄挂（bash 默认带 -e）
          set +e
          set -uo pipefail
          echo "### Windows 基线" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s windows-test.log ]; then
            echo "- ⚠️ 测试没有产生日志（可能在安装依赖阶段就失败了）" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Windows baseline::测试没有产生日志"
            exit 0
          fi

          SUMMARY="$(grep -E '^# (tests|pass|fail|cancelled) ' windows-test.log | tr '\n' ' ' || true)"
          if grep -qE '^# fail 0$' windows-test.log; then
            echo "- ✅ 测试通过：${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ 测试失败：${SUMMARY:-没有汇总行}" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Windows baseline failed::${SUMMARY:-见 windows-test.log}"
          fi

          if grep -qE '^\[.*\]' windows-check.log 2>/dev/null; then
            echo "- 静态检查输出见 artifact `windows-baseline-logs`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-baseline-logs
          path: |
            windows-*.log
          if-no-files-found: ignore
