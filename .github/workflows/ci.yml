name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 静态检查
        run: npm run check

      - name: 测试
        run: npm test

  windows:
    # 已知 POSIX 假设（session-launch / agent-hooks / chmod），先记录基线不阻断，
    # 等 Windows 适配收口后再改成必过。见 docs/plans/cli-cross-platform-verify.md §3.2。
    name: windows baseline（不阻断）
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: 测试
        run: npm test 2>&1 | tee windows-test.log
        shell: bash
        continue-on-error: true

      - name: 静态检查
        run: npm run check 2>&1 | tee -a windows-check.log
        shell: bash
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-baseline-logs
          path: |
            windows-*.log
          if-no-files-found: ignore
