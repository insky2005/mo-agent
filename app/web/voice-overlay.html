<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mo-agent 语音</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    color: #f5f5f7;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 0;
    border-radius: 18px;
    /* 固定同一档透明度：正常/错误/确认都只改文字颜色，不改面板底色。
       0.96 基本挡住下层文字，又保留一点半透明质感。 */
    background: rgba(20, 20, 28, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 16px 46px rgba(0, 0, 0, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    /* 不用 backdrop-filter：透明 WKWebView 下它的合成会在首帧/音频路由变化后跳变，
       表现为“错误出现 1 秒后透明度又变了”。固定 alpha 从第一帧起就稳定。 */
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 整条顶栏（含左右边缘与上方内边距）都可拖动，不再只有文字中间一小块。 */
  .head {
    box-sizing: border-box;
    flex: 0 0 auto;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 18px 18px 0 0;
  }
  .body {
    box-sizing: border-box;
    flex: 1 1 auto;
    min-height: 0;
    padding: 10px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    overflow: hidden;
  }
  .drag {
    -webkit-app-region: drag;
    app-region: drag;
    cursor: grab;
  }
  .no-drag, button {
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }
  .head { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6ee7b7; box-shadow: 0 0 10px rgba(110, 231, 183, 0.8); animation: pulse 1.4s ease-in-out infinite; flex: 0 0 auto; }
  .dot.hot { background: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.8); }
  .dot.err { background: #f87171; box-shadow: 0 0 10px rgba(248, 113, 113, 0.8); animation: none; }
  .title { flex: 1; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); }
  .close {
    border: 0; background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.55);
    width: 24px; height: 24px; border-radius: 7px; font-size: 15px; line-height: 1;
    cursor: pointer; padding: 0;
  }
  .close:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
  .status { font-size: 13px; font-weight: 600; color: #a7f3d0; min-height: 18px; }
  .status.err { color: #fca5a5; }
  .heard-label { font-size: 10px; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.42); margin-bottom: 2px; }
  .heard { font-size: 21px; font-weight: 600; line-height: 1.25; min-height: 27px; word-break: break-word; }
  .heard.empty { color: rgba(255, 255, 255, 0.32); font-weight: 500; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .badge {
    font-size: 10px; padding: 3px 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.7);
  }
  .badge.intent { color: #c4b5fd; border-color: rgba(196, 181, 253, 0.25); }
  .badge.confirmed { color: #86efac; border-color: rgba(134, 239, 172, 0.3); }
  .badge.cancelled { color: #fca5a5; border-color: rgba(252, 165, 165, 0.3); }
  .reply {
    flex: 1 1 auto; min-height: 44px; overflow: hidden;
    font-size: 13px; line-height: 1.45; color: rgba(255, 255, 255, 0.82);
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px; padding: 8px 10px;
    word-break: break-word;
  }
  .reply.ok { color: #bbf7d0; }
  .reply.err { color: #fecaca; }
  .target { color: #bae6fd; border-color: rgba(186, 230, 253, 0.25); }
  .dictate-only { display: none; }
  body.dictate .dictate-only { display: inline-block; }
  .draft-area {
    display: none; flex: 1 1 auto; min-height: 70px; max-height: 150px;
    flex-direction: column; gap: 4px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px; padding: 8px 10px;
  }
  body.dictate .draft-area.on { display: flex; }
  .draft-head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.42); }
  .draft-text {
    flex: 1 1 auto; overflow-y: auto; font-size: 13px; line-height: 1.5;
    color: rgba(255, 255, 255, 0.88); white-space: pre-wrap; word-break: break-word;
  }
  .hint { flex: 0 0 auto; font-size: 10px; color: rgba(255, 255, 255, 0.34); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .actions button {
    flex: 1 1 0; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.82);
    border-radius: 10px; padding: 6px 4px; font-size: 11px; font-weight: 600;
    cursor: pointer;
  }
  .actions button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); color: #fff; }
  .actions button:active:not(:disabled) { transform: scale(0.98); }
  .actions button:disabled { opacity: 0.4; cursor: default; }
  .panel, .panel * { -webkit-user-select: none; user-select: none; }
  .bars { display: none; align-items: flex-end; gap: 2px; height: 18px; }
  .bars.on { display: flex; }
  .bars span { display: block; width: 3px; border-radius: 2px; background: #a7f3d0; animation: wave 1s ease-in-out infinite; }
  .bars span:nth-child(2) { animation-delay: .1s; }
  .bars span:nth-child(3) { animation-delay: .2s; }
  .bars span:nth-child(4) { animation-delay: .3s; }
  .bars span:nth-child(5) { animation-delay: .4s; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes wave { 0%, 100% { height: 5px; } 50% { height: 17px; } }
</style>
</head>
<body>
<div class="panel">
  <div class="head drag electrobun-webkit-app-region-drag">
    <span class="dot" id="dot"></span>
    <span class="title">mo-agent · 语音</span>
    <div class="bars" id="bars"><span></span><span></span><span></span><span></span><span></span></div>
    <button class="close electrobun-webkit-app-region-no-drag" id="close" title="隐藏浮层（可从托盘重新打开）">×</button>
  </div>
  <div class="body">
  <div class="status" id="status">等待命令…</div>
  <div>
    <div class="heard-label">听到</div>
    <div class="heard empty" id="heard">—</div>
  </div>
  <div class="row">
    <span class="badge intent" id="intent">意图 unknown</span>
    <span class="badge" id="confidence">置信度 —</span>
    <span class="badge target dictate-only" id="target">目标 —</span>
    <span class="badge dictate-only" id="chars">— 字</span>
  </div>
  <div class="draft-area" id="draftArea">
    <div class="draft-head"><span>草稿</span><span id="draftMeta">0 字</span></div>
    <div class="draft-text" id="draftText">—</div>
  </div>
  <div class="reply" id="reply">点托盘「语音」→「语音命令」，听到提示音后再说。</div>
  <div class="hint" id="hint">听到「叮」再说；有副作用的命令会先回读，再等你说确认。</div>
  <div class="actions no-drag">
    <button type="button" id="btn-command">语音命令</button>
    <button type="button" id="btn-dictate">语音口述</button>
    <button type="button" id="btn-test">语音测试</button>
  </div>
  </div>
</div>
<script>
(function () {
  // 拖动浮层时不要顺带选中文字或拖出图片/链接。
  document.addEventListener("selectstart", function (event) { event.preventDefault(); });
  document.addEventListener("dragstart", function (event) { event.preventDefault(); });

  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const els = {
    dot: document.getElementById("dot"),
    status: document.getElementById("status"),
    heard: document.getElementById("heard"),
    intent: document.getElementById("intent"),
    confidence: document.getElementById("confidence"),
    reply: document.getElementById("reply"),
    hint: document.getElementById("hint"),
    bars: document.getElementById("bars"),
    close: document.getElementById("close"),
    target: document.getElementById("target"),
    chars: document.getElementById("chars"),
    draftArea: document.getElementById("draftArea"),
    draftMeta: document.getElementById("draftMeta"),
    draftText: document.getElementById("draftText"),
    btnCommand: document.getElementById("btn-command"),
    btnDictate: document.getElementById("btn-dictate"),
    btnTest: document.getElementById("btn-test"),
  };
  const intentLabels = {
    status: "状态查询",
    pause: "暂停语音",
    resume: "继续语音",
    switch: "切换会话",
    help: "帮助",
    dictate: "语音口述",
    test: "语音测试",
    unknown: "未识别",
  };
  const confirmLabels = {
    confirm: "已确认",
    reject: "已拒绝",
    cancel: "已取消",
    retry: "重说",
    repeat: "重复",
    unknown: "无明确确认",
    empty: "没有听清",
  };

  function setStatus(text, tone) {
    els.status.textContent = text;
    els.status.classList.toggle("err", tone === "err");
    els.dot.classList.toggle("hot", tone === "hot");
    els.dot.classList.toggle("err", tone === "err");
    els.bars.classList.toggle("on", tone === "hot");
  }
  function setHeard(text) {
    els.heard.textContent = text || "—";
    els.heard.classList.toggle("empty", !text);
  }
  function setConfidence(value) {
    if (typeof value === "number") {
      els.confidence.textContent = "置信度 " + value.toFixed(2);
    } else {
      els.confidence.textContent = "置信度 —";
    }
  }
  function setTarget(target, source, ok) {
    const title = target && target.title ? target.title : "";
    els.target.textContent = "目标 " + (title || (ok === false ? "未确定" : "—"));
    els.target.title = source === "single-active" ? "唯一活跃会话（自动选择）" : (source === "focus" ? "当前关注会话" : "");
    if (typeof target !== "undefined" && target === null && ok === false) {
      els.target.className = "badge target cancelled dictate-only";
    } else {
      els.target.className = "badge target dictate-only";
    }
  }
  function setDraft(text, chars) {
    const value = String(text || "");
    if (!value) {
      els.draftArea.classList.remove("on");
      els.draftText.textContent = "—";
      els.draftMeta.textContent = "0 字";
      els.chars.textContent = "— 字";
      return;
    }
    els.draftArea.classList.add("on");
    els.draftText.textContent = value;
    els.draftText.scrollTop = 0;
    const count = typeof chars === "number" ? chars : Array.from(value).length;
    els.draftMeta.textContent = count + " 字";
    els.chars.textContent = count + " 字";
  }
  function reset(mode) {
    document.body.classList.toggle("dictate", mode === "dictate");
    setStatus("正在准备麦克风…", "hot");
    setHeard("");
    setConfidence(null);
    els.intent.textContent = "意图 —";
    els.intent.className = "badge intent";
    els.target.textContent = "目标 —";
    els.target.className = "badge target dictate-only";
    setDraft("", 0);
    els.reply.textContent = mode === "dictate"
      ? "请说你要交给 Agent 的内容；说完会先形成草稿，不会直接发送。"
      : "等待识别…";
    els.reply.className = "reply";
    els.hint.textContent = mode === "dictate"
      ? "只有说「确认发送」才发送；说「重说」重录一次，说「取消」放弃。"
      : "听到「叮」再说。";
  }

  function render(event) {
    switch (event.phase) {
      case "start":
        reset(event.mode);
        break;
      case "listening":
        setStatus(event.stage === "confirm"
          ? "正在听你的确认…"
          : (event.attempt > 1 ? "正在再听一次…" : "正在听…"), "hot");
        break;
      case "heard":
        setHeard(event.text);
        setConfidence(event.confidence);
        if (event.stage === "record" || event.stage === "retry") {
          setStatus(event.lowConfidence ? "听到的声音不太确定" : "已识别，正在形成草稿…", event.lowConfidence ? "err" : "hot");
        } else {
          setStatus(event.lowConfidence ? "听到的声音不太确定" : "已识别，正在解析…", event.lowConfidence ? "err" : "hot");
        }
        break;
      case "listen-error":
        setStatus("没有听到声音，准备重试…", "err");
        els.hint.textContent = "错误：" + (event.error || "unknown");
        break;
      case "target": {
        setTarget(event.target, event.source, event.ok);
        if (!event.ok) {
          const names = (event.candidates || []).map(function (item) { return item.title; }).join("；");
          els.hint.textContent = names ? ("候选：" + names) : "没有可用的会话。";
        }
        break;
      }
      case "draft":
        setTarget(event.target, event.target && event.target.source, event.ok);
        setDraft(event.text, event.chars);
        els.intent.textContent = "意图 语音口述";
        els.intent.className = "badge intent";
        setStatus(event.ok ? "草稿已生成，正在回读…" : "未发送", event.ok ? "hot" : "err");
        els.reply.textContent = event.prompt || (event.error ? ("未发送 · " + event.error) : "草稿已生成。");
        els.reply.className = "reply" + (event.ok ? "" : " err");
        break;
      case "retry":
        setDraft("", 0);
        setStatus("已丢弃，请重新说…", "hot");
        els.hint.textContent = "这次重录只再给一次机会。";
        break;
      case "sending":
        setStatus("正在发送…", "hot");
        els.reply.textContent = "草稿已确认，正在发送给「"
          + (event.target && event.target.title ? event.target.title : "目标会话") + "」。";
        els.reply.className = "reply";
        break;
      case "parsed":
        if (event.intent) {
          els.intent.textContent = "意图 " + (intentLabels[event.intent] || event.intent);
          els.intent.className = "badge intent";
        }
        if (event.reason) {
          els.hint.textContent = "未执行 · " + event.reason;
        }
        break;
      case "confirm":
        setStatus("等待确认", "hot");
        els.reply.textContent = event.prompt || "";
        els.reply.className = "reply";
        els.hint.textContent = "只有明确说「确认」才执行；说「取消」放弃。";
        break;
      case "confirm-heard": {
        setHeard(event.text);
        setConfidence(event.confidence);
        // 口述认「确认发送」；「同意」「确定」不算确认，这里显示为“无明确确认”。
        const label = event.confirmed ? "已确认" : (confirmLabels[event.intent] || "无明确确认");
        els.intent.textContent = "确认：" + label;
        els.intent.className = "badge " + (event.confirmed ? "confirmed" : "cancelled");
        setStatus(event.confirmed ? "已确认，正在执行…" : "没有确认，未执行", event.confirmed ? "hot" : "err");
        break;
      }
      case "confirm-error":
        setStatus("没有听到确认，准备重试…", "err");
        break;
      case "result": {
        const sentTarget = event.ok && event.action === "sent" && event.target && event.target.title
          ? event.target.title : "";
        setStatus(sentTarget ? ("已发送给「" + sentTarget + "」") : (event.ok ? "完成" : "未发送"), event.ok ? "ok" : "err");
        if (event.intent) {
          els.intent.textContent = "意图 " + (intentLabels[event.intent] || event.intent);
          els.intent.className = "badge intent";
        }
        if (event.target) setTarget(event.target, event.target.source, event.ok);
        if (event.text) setDraft(event.text, event.chars);
        els.reply.textContent = event.reply || "";
        els.reply.className = "reply " + (event.ok ? "ok" : "err");
        const candidates = (event.candidates || []).map(function (item) { return item.title; }).join("；");
        els.hint.textContent = event.ok
          ? "结果已显示，随后播报。"
          : (candidates ? ("未发送；候选：" + candidates) : "未发送，草稿保留；可以重新点「语音口述任务」。");
        break;
      }
      case "done":
        if (els.status.classList.contains("err")) break;
        if (event.intent === "dictate" && els.status.textContent.indexOf("已发送给") === 0) break;
        setStatus(event.ok ? "完成" : "未发送", event.ok ? "ok" : "err");
        break;
      default:
        break;
    }
  }

  // 浮层里的三个按钮直接调 host 的本机接口；命令/口述的实时进度仍走 SSE。
  let busy = false;
  let eventCount = 0;
  const endpoints = {
    command: "/local/voice-command",
    dictate: "/local/dictate",
    test: "/local/voice-test",
  };

  function setBusy(value) {
    busy = value;
    els.btnCommand.disabled = value;
    els.btnDictate.disabled = value;
    els.btnTest.disabled = value;
  }

  function renderTest(result) {
    const heard = Array.isArray(result.heard)
      ? result.heard.map(function (item) { return item.text; }).filter(Boolean).join(" / ")
      : "";
    const outcome = result.outcome || (result.ok ? "ok" : (result.error || "unknown"));
    const passed = !!result.ok && result.outcome === "allow";
    setStatus(result.ok ? ("测试完成：" + outcome) : ("测试结束：" + outcome), passed ? "ok" : "err");
    setHeard(heard);
    setConfidence(null);
    els.intent.textContent = "意图 语音测试";
    els.intent.className = "badge intent";
    els.reply.textContent = result.ok ? "语音链路已跑通。" : "测试没有完成，请查看 host.log。";
    els.reply.className = "reply " + (passed ? "ok" : "err");
    els.hint.textContent = "结果已显示，随后播报。";
  }

  function renderFallback(kind, result) {
    if (result.draft && result.draft.text) setDraft(result.draft.text, result.draft.chars);
    if (result.target) setTarget(result.target, result.target.source, result.ok);
    render({
      phase: "result",
      ok: !!result.ok,
      intent: result.intent || (kind === "dictate" ? "dictate" : (kind === "test" ? "test" : "unknown")),
      action: result.action,
      reply: result.reply || (result.error ? ("未执行 · " + result.error) : ""),
      error: result.error,
      target: result.target,
      candidates: result.candidates,
      text: result.draft && result.draft.text,
      chars: result.draft && result.draft.chars,
    });
  }

  async function invoke(kind) {
    if (!token) {
      setStatus("缺少本机令牌，无法执行", "err");
      return;
    }
    if (busy) return;
    setBusy(true);
    const before = eventCount;
    try {
      const response = await fetch(endpoints[kind], {
        method: "POST",
        headers: { "content-type": "application/json", "x-mo-agent-local": token },
        body: "{}",
      });
      const result = await response.json().catch(function () { return {}; });
      if (!response.ok) throw new Error(result.error || ("HTTP " + response.status));
      // SSE 在线时以实时事件为准；断线时用接口返回值兜底，避免按钮看起来没反应。
      if (eventCount === before) {
        if (kind === "test") renderTest(result);
        else renderFallback(kind, result);
      }
    } catch (error) {
      setStatus("请求失败", "err");
      els.hint.textContent = String(error && error.message ? error.message : error);
    } finally {
      setBusy(false);
    }
  }

  els.btnCommand.addEventListener("click", function () { invoke("command"); });
  els.btnDictate.addEventListener("click", function () { invoke("dictate"); });
  els.btnTest.addEventListener("click", function () { invoke("test"); });

  let source = null;
  if (!token) {
    setStatus("缺少本机令牌，无法连接", "err");
    els.hint.textContent = "从托盘重新打开语音浮层。";
    setBusy(true);
  } else {
    source = new EventSource("/local/voice-events?token=" + encodeURIComponent(token));
    source.onmessage = function (message) {
      try {
        eventCount += 1;
        render(JSON.parse(message.data));
      } catch (error) {
        /* 忽略坏事件 */
      }
    };
    source.onerror = function () {
      setStatus("连接断开，正在重连…", "err");
    };
  }

  els.close.addEventListener("click", function () {
    // 通过 Electrobun 的 host 消息让桌面端真正隐藏窗口；window.close() 在无边框面板里不可靠。
    const sendToHost = window.__electrobunSendToHost;
    if (typeof sendToHost === "function") {
      try {
        sendToHost({ type: "overlay-hide" });
        return;
      } catch (error) {
        /* 回退到 window.close */
      }
    }
    try { window.close(); } catch (error) { /* 忽略 */ }
  });
})();
</script>
</body>
</html>
