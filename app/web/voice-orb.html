<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mo-agent 语音</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    cursor: pointer;
  }
  .orb {
    box-sizing: border-box;
    width: 82px; height: 82px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 32% 24%, rgba(79, 140, 255, 0.34), rgba(11, 16, 32, 0.97) 62%);
    border: 1px solid rgba(79, 140, 255, 0.62);
    cursor: pointer;
    outline: none;
    animation: orb-breathe 2.8s ease-in-out infinite;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .orb:hover { border-color: rgba(53, 209, 154, 0.8); transform: scale(1.045); }
  .orb:active { transform: scale(0.96); }
  .orb img {
    width: 52px; height: 52px; border-radius: 50%;
    pointer-events: none; display: block;
  }
  @keyframes orb-breathe {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(79, 140, 255, 0.35),
        0 0 14px rgba(79, 140, 255, 0.30),
        0 0 22px rgba(53, 209, 154, 0.08);
      transform: scale(1);
    }
    50% {
      box-shadow:
        0 0 0 3px rgba(79, 140, 255, 0.52),
        0 0 20px rgba(79, 140, 255, 0.46),
        0 0 28px rgba(53, 209, 154, 0.20);
      transform: scale(1.035);
    }
  }
</style>
</head>
<body>
<div class="orb" id="orb" role="button" tabindex="0" title="显示语音浮层">
  <img src="/icon.svg" alt="mo-agent">
</div>
<script>
(function () {
  const orb = document.getElementById("orb");

  const sendToHost = window.__electrobunSendToHost;

  function post(message) {
    if (typeof sendToHost !== "function") return false;
    try {
      sendToHost(message);
      return true;
    } catch (error) {
      return false;
    }
  }

  function openOverlay() {
    post({ type: "overlay-show" });
  }

  // 整个透明窗口都能按；拖动超过 3px 才移动窗口，否则算一次点击。
  let dragging = false;
  let moved = false;
  let startX = 0;
  let startY = 0;
  let pointerId = null;

  document.body.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    dragging = true;
    moved = false;
    startX = event.screenX;
    startY = event.screenY;
    pointerId = event.pointerId;
    try { document.body.setPointerCapture(event.pointerId); } catch (error) { /* 忽略 */ }
    event.preventDefault();
  });

  document.body.addEventListener("pointermove", function (event) {
    if (!dragging) return;
    const dx = event.screenX - startX;
    const dy = event.screenY - startY;
    if (!moved) {
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      moved = true;
      post({ type: "orb-drag-start" });
    }
    post({ type: "orb-drag-move", dx: dx, dy: dy });
    event.preventDefault();
  });

  function finishDrag(event) {
    if (!dragging) return;
    dragging = false;
    try {
      if (pointerId !== null) document.body.releasePointerCapture(pointerId);
    } catch (error) { /* 忽略 */ }
    pointerId = null;
    if (moved) post({ type: "orb-drag-end" });
    else openOverlay();
    event.preventDefault();
  }

  document.body.addEventListener("pointerup", finishDrag);
  document.body.addEventListener("pointercancel", finishDrag);
  orb.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openOverlay();
    }
  });
})();
</script>
</body>
</html>
