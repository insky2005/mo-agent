<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mo-agent 语音</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body {
    /* 圆形贴住窗口右上角：窗口右上角就是浮层右上角，视觉上不再留内边距。 */
    display: flex; align-items: flex-start; justify-content: flex-end;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    cursor: pointer;
  }
  .orb {
    box-sizing: border-box;
    width: 82px; height: 82px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 32% 24%, rgba(79, 140, 255, 0.34), rgba(11, 16, 32, 0.97) 62%);
    border: 1px solid rgba(79, 140, 255, 0.62);
    cursor: pointer;
    outline: none;
    opacity: 1;
    animation: orb-breathe 2.8s ease-in-out infinite;
    transition: transform 120ms ease, border-color 120ms ease, opacity 180ms ease;
  }
  body.unfocused .orb { opacity: 0.52; }
  .orb:hover { border-color: rgba(53, 209, 154, 0.8); }
  .orb:active { transform: scale(0.95); }
  .orb img {
    width: 52px; height: 52px; border-radius: 50%;
    pointer-events: none; display: block;
  }
  @keyframes orb-breathe {
    0%, 100% {
      box-shadow:
        inset 0 0 0 1px rgba(79, 140, 255, 0.38),
        inset 0 0 14px rgba(79, 140, 255, 0.20);
    }
    50% {
      box-shadow:
        inset 0 0 0 3px rgba(79, 140, 255, 0.58),
        inset 0 0 22px rgba(53, 209, 154, 0.24);
    }
  }
</style>
</head>
<body>
<div class="orb" id="orb" role="button" tabindex="0" title="显示语音浮层">
  <img src="/icon.svg" alt="mo-agent">
</div>
<script>
(function () {
  const orb = document.getElementById("orb");

  const sendToHost = window.__electrobunSendToHost;

  // 窗口失焦时降低透明感，重新获得焦点后恢复。
  window.addEventListener("focus", function () {
    document.body.classList.remove("unfocused");
  });
  window.addEventListener("blur", function () {
    document.body.classList.add("unfocused");
  });

  function post(message) {
    if (typeof sendToHost !== "function") return false;
    try {
      sendToHost(message);
      return true;
    } catch (error) {
      return false;
    }
  }

  function openOverlay() {
    post({ type: "overlay-show" });
  }

  // 整个透明窗口都能按；拖动超过 3px 才移动窗口，否则算一次点击。
  let dragging = false;
  let moved = false;
  let startX = 0;
  let startY = 0;
  let pointerId = null;

  document.body.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    dragging = true;
    moved = false;
    startX = event.clientX;
    startY = event.clientY;
    pointerId = event.pointerId;
    try { document.body.setPointerCapture(event.pointerId); } catch (error) { /* 忽略 */ }
    event.preventDefault();
  });

  document.body.addEventListener("pointermove", function (event) {
    if (!dragging || moved) return;
    // 只负责判断“这是拖动还是点击”；真正的位移由桌面端按系统光标位置完成。
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    moved = true;
    post({ type: "orb-drag-start" });
    event.preventDefault();
  });

  function finishDrag(event) {
    if (!dragging) return;
    dragging = false;
    try {
      if (pointerId !== null) document.body.releasePointerCapture(pointerId);
    } catch (error) { /* 忽略 */ }
    pointerId = null;
    if (moved) post({ type: "orb-drag-end" });
    else openOverlay();
    event.preventDefault();
  }

  document.body.addEventListener("pointerup", finishDrag);
  document.body.addEventListener("pointercancel", finishDrag);
  orb.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openOverlay();
    }
  });
})();
</script>
</body>
</html>
